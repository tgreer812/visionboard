<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vision Board</title>
  <meta name="description" content="A shared reference board for images, video, audio, 3D models and notes.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Instrument+Serif&display=swap">
</head>
<body class="dotgrid landing">
  <div class="floaters" aria-hidden="true">
    <div class="floater f1"></div>
    <div class="floater f2"></div>
    <div class="floater f3"></div>
    <div class="floater f4"><span>ideas</span></div>
  </div>

  <main class="hero">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 28"><path d="M12 1C6.5 1 3 5 3 10.5V26l3-2.2 3 2.2 3-2.2 3 2.2 3-2.2 3 2.2V10.5C21 5 17.5 1 12 1z"/><circle cx="9" cy="11" r="1.7"/><circle cx="15" cy="11" r="1.7"/></svg>
    </div>
    <h1>Vision Board</h1>
    <p class="lede">Throw references on an endless board together. Images, video, audio, 3D models and notes, live for everyone in the room.</p>

    <div class="actions">
      <button class="btn primary big" id="create" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Create a room
      </button>
      <form id="join" class="join" autocomplete="off">
        <label class="sr" for="code">Room code</label>
        <input id="code" name="code" placeholder="Room code or link" spellcheck="false" autocapitalize="none" maxlength="200">
        <button class="btn" type="submit">Join</button>
      </form>
      <p class="error" id="error" role="alert" hidden></p>
    </div>

    <section class="recent" id="recent" hidden>
      <h2>Your recent rooms</h2>
      <ul id="recent-list"></ul>
    </section>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <script type="module" src="/src/landing.js"></script>
</body>
</html>
